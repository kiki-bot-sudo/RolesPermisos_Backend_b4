type Account {
  id: ID!
  companyId: ID!
  accountType: AccountType!
  name: String!
  bankName: String
  accountNumber: String
  clabe: String
  cardLastDigits: String
  shortDescription: String
  longDescription: String
  isActive: Boolean!
  createdAt: Time!
  updatedAt: Time!
  company: Company!
}

type AccountConcept {
  id: ID!
  accountId: ID!
  conceptId: ID!
  isActive: Boolean!
  createdAt: Time!
  account: Account!
  concept: Concept!
}

enum AccountType {
  DEBIT
  CREDIT
  CASH
  SAVINGS
  INVESTMENT
  WALLET
  OTHER
}

input AssignConceptToAccountInput {
  accountId: ID!
  conceptId: ID!
}

type AuthPayload {
  token: String!
  tokenType: String!
  user: AuthUser!
}

type AuthUser {
  id: ID!
  name: String!
  email: String!
}

type Company {
  id: ID!
  name: String!
  legalName: String
  taxId: String
  email: String
  phone: String
  isActive: Boolean!
  createdAt: Time!
  updatedAt: Time!
}

type CompanyUser {
  id: ID!
  companyId: ID!
  userId: ID!
  isAdmin: Boolean!
  isActive: Boolean!
  joinedAt: Time!
  company: Company!
  user: User!
}

type Concept {
  id: ID!
  companyId: ID!
  conceptType: ConceptType!
  name: String!
  shortDescription: String
  longDescription: String
  isActive: Boolean!
  createdAt: Time!
  updatedAt: Time!
}

enum ConceptType {
  INCOME
  EXPENSE
}

input CreateAccountInput {
  companyId: ID!
  accountType: AccountType!
  name: String!
  bankName: String
  accountNumber: String
  clabe: String
  cardLastDigits: String
  shortDescription: String
  longDescription: String
}

input CreateCompanyAdminInput {
  companyId: ID!
  name: String!
  email: String!
  password: String!
}

input CreateCompanyInput {
  name: String!
  legalName: String
  taxId: String
  email: String
  phone: String
}

input CreateCompanyUserInput {
  companyId: ID!
  name: String!
  email: String!
  password: String!
}

input CreateConceptInput {
  companyId: ID!
  conceptType: ConceptType!
  name: String!
  shortDescription: String
  longDescription: String
}

input CreateTransactionInput {
  accountId: ID!
  conceptId: ID!
  transactionType: TransactionType!
  amount: Decimal!
  transactionDate: Time
  shortDescription: String
  longDescription: String
}

scalar Decimal

input LoginInput {
  email: String!
  password: String!
}

type Mutation {
  createAccount(input: CreateAccountInput!): Account!
  createConcept(input: CreateConceptInput!): Concept!
  assignConceptToAccount(input: AssignConceptToAccountInput!): AccountConcept!
  removeConceptFromAccount(accountId: ID!, conceptId: ID!): Boolean!
  createTransaction(input: CreateTransactionInput!): Transaction!
  deleteTransaction(id: ID!): Transaction!
  createCompany(input: CreateCompanyInput!): Company!
  updateCompany(input: UpdateCompanyInput!): Company!
  deactivateCompany(id: ID!): Company!
  createCompanyAdmin(input: CreateCompanyAdminInput!): CompanyUser!
  createCompanyUser(input: CreateCompanyUserInput!): CompanyUser!
  deactivateCompanyUser(id: ID!): CompanyUser!
  login(input: LoginInput!): AuthPayload!
}

type Query {
  accounts(companyId: ID!, accountType: AccountType, activeOnly: Boolean): [Account!]!
  concepts(companyId: ID!, conceptType: ConceptType, activeOnly: Boolean): [Concept!]!
  accountConcepts(accountId: ID!): [AccountConcept!]!
  transactions(accountId: ID, transactionType: TransactionType, limit: Int, offset: Int): [Transaction!]!

  """Extensión: ingresos activos menos egresos activos, sin paginación."""
  accountBalance(accountId: ID!): Decimal!
  companies(activeOnly: Boolean): [Company!]!
  company(id: ID!): Company
  companyUsers(companyId: ID!): [CompanyUser!]!
}

scalar Time

type Transaction {
  id: ID!
  accountId: ID!
  conceptId: ID!
  transactionType: TransactionType!
  amount: Decimal!
  transactionDate: Time!
  capturedAt: Time!
  capturedBy: ID!
  shortDescription: String
  longDescription: String
  isActive: Boolean!
  createdAt: Time!
  updatedAt: Time!
  account: Account!
  concept: Concept!
  capturedByUser: User!
}

enum TransactionType {
  INCOME
  EXPENSE
}

input UpdateCompanyInput {
  id: ID!
  name: String
  legalName: String
  taxId: String
  email: String
  phone: String
  isActive: Boolean
}

type User {
  id: ID!
  name: String!
  email: String!
  emailVerified: Boolean!
  isActive: Boolean!
  createdAt: Time!
  updatedAt: Time!
}
